<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PC 내비게이션 모니터</title>
    <script src="/socket.io/socket.io.js"></script>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_APP_KEY"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; text-align: center; }
        #map { width: 100vw; height: 80vh; background-color: #eee; }
        #info-panel { height: 20vh; background: #222; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="info-panel">
        <div id="status">스마트폰 내비게이션 연결 대기 중... (접속 코드 생성 중)</div>
    </div>

    <script>
        const socket = io();
        let map, marker;

        // 1. 카카오 지도 초기화 (기본 중심 좌표: 서울시청)
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(37.5665, 126.9780),
            level: 3
        };
        map = new kakao.maps. someMap ? kakao.maps.someMap : new kakao.maps.Map(container, options);

        // 실시간 움직임을 표시할 마커(자동차 역할) 생성
        marker = new kakao.maps.Marker({ position: map.getCenter() });
        marker.setMap(map);

        // 2. 서버에 방 생성 요청
        socket.emit('create-room');

        socket.on('room-created', (roomId) => {
            document.getElementById('status').innerText = `📱 스마트폰 브라우저에서 /mobile.html?room=${roomId} 로 접속하세요.`;
        });

        socket.on('remote-connected', () => {
            document.getElementById('status').innerText = `🟢 내비게이션 연동 완료! 실시간 주행 시작 가능`;
            document.getElementById('status').style.color = "#10b981";
        });

        // 3. 모바일로부터 실시간 GPS 좌표 및 주행 정보 수신
        socket.on('receive-control', (data) => {
            if (data.type === 'NAV_UPDATE') {
                const lat = data.latitude;
                const lng = data.longitude;
                const nextStep = data.nextStep;

                // 지도 중심을 스마트폰 주행 위치로 이동
                const newPos = new kakao.maps.LatLng(lat, lng);
                map.setCenter(newPos);
                marker.setPosition(newPos);

                // 하단에 실시간 주행 안내 문구 표출
                document.getElementById('status').innerText = `🚘 실시간 주행 중: ${nextStep}`;
            }
        });
    </script>
</body>
</html>
