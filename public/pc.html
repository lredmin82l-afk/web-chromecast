<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MirrorCast 수신 모니터</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { margin: 0; background-color: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #status-panel { margin-bottom: 15px; font-size: 18px; padding: 10px 20px; border-radius: 30px; background-color: #1e1e1e; display: flex; align-items: center; gap: 10px; }
        .badge { padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; }
        .badge-ready { background-color: #34c759; }
        .badge-live { background-color: #ff3b30; animation: blink 1.5s infinite; }
        .badge-disconnected { background-color: #555; }
        #mirror-view { max-width: 90vw; max-height: 70vh; border: 4px solid #2a2a2a; border-radius: 16px; background-color: #000; display: none; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        #debug-console { width: 500px; height: 120px; margin-top: 15px; background-color: #000; border: 1px solid #333; font-family: monospace; font-size: 11px; color: #00ff00; overflow-y: scroll; border-radius: 8px; padding: 10px; box-sizing: border-box;}
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div id="status-panel">
        <span id="badge" class="badge badge-disconnected">CONNECTING</span>
        <span id="status-text">서버 연결 대기 중...</span>
    </div>

    <img id="mirror-view" src="" alt="스마트폰 미러링 화면">
    <div id="debug-console">📋 [시스템 가동] 서버 신호 감시 중...</div>

    <script>
        const socket = io("https://web-chromecast.onrender.com", { transports: ['websocket'] });
        const targetRoomId = "my_test_room"; 

        const badge = document.getElementById("badge");
        const statusText = document.getElementById("status-text");
        const mirrorView = document.getElementById("mirror-view");
        const debugConsole = document.getElementById("debug-console");

        function printLog(msg) {
            debugConsole.innerHTML += "<br>➔ " + msg;
            debugConsole.scrollTop = debugConsole.scrollHeight;
        }

        socket.on("connect", () => {
            badge.className = "badge badge-ready";
            badge.innerText = "READY";
            statusText.innerText = `대기 중... 스마트폰 앱 버튼을 눌러주세요.`;
            printLog("🎯 서버 연결 성공! 방 입장을 요청합니다.");
            socket.emit("join-room", targetRoomId);
        });

        socket.on("disconnect", () => {
            badge.className = "badge badge-disconnected";
            badge.innerText = "OFFLINE";
            mirrorView.style.display = "none";
        });

        // 🌟 [핵심 수정] 서버가 중계해 준 webrtc-offer 신호 주머니를 열어서 이미지를 꺼냅니다.
        socket.on("webrtc-offer", (data) => {
            if (data && data.image) {
                if (badge.innerText !== "LIVE") {
                    badge.className = "badge badge-live";
                    badge.innerText = "LIVE";
                    statusText.innerText = `실시간 화면 송출 중`;
                    mirrorView.style.display = "block";
                }
                mirrorView.src = data.image;
                printLog(`⚡ 화면 프레임 복제 성공! (${Math.round(data.image.length / 1024)} KB)`);
            }
        });
    </script>
</body>
</html>
